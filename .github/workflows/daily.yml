name: Suyesh Market Update Bot

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM IST = 1:30 UTC, every day - morning outlook
    - cron: "30 1 * * *"
    # 7:00 PM IST = 13:30 UTC, every day - evening recap
    - cron: "30 13 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: python bot.py
